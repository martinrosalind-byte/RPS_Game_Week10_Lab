<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rock, Paper, Scissors</h1>
		
		<div id="round-info" class="round">
			Round: <span id="current-round">1</span> of 5
		</div>

        <div id="score-counter" class="score">
			Your Wins: <span id="user-score">0</span> | Computer Wins: <span id="computer-score">0</span>
		</div>
		
		<div id="result-display" class="result">
			Make your choice to start the game!
		</div>

		<div class="choices">
            <button id="rock" class="choice-btn">Rock 🪨</button>
            <button id="paper" class="choice-btn">Paper 📄</button>
            <button id="scissors" class="choice-btn">Scissors ✂️</button>
        </div>
      
		<button id="reset-btn" class="reset-btn" style="display:none;">Play Again</button>
	  
    </div>

    <script src="script.js"></script>
</body>
</html>
